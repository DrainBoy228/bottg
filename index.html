<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Artist Commission Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgCream: '#FDFBF7', primaryPink: '#F4C7CC', textDark: '#4A4345', softRed: '#ffc1c1', softRedText: '#d9534f',
                        darkBg: '#121212', darkPink: '#A5737A', darkSurface: '#1E1E1E'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background-color: #FDFBF7; color: #4A4345; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s; }
        #app-container { display: flex; flex-direction: column; height: 100dvh; max-width: 32rem; margin: 0 auto; }
        #app-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #F4C7CC; border-radius: 4px; }
        .glowing-dot { box-shadow: 0 0 8px #F4C7CC, 0 0 12px #F4C7CC; animation: pulse-glow 2s infinite; }
        .dark .glowing-dot { box-shadow: 0 0 8px #A5737A, 0 0 12px #A5737A; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
        .custom-input { width: 100%; background-color: white; border: 2px solid #FDFBF7; border-radius: 0.75rem; padding: 0.75rem 1rem; color: #4A4345; transition: border-color 0.2s ease; outline: none; }
        .dark .custom-input { background-color: #1E1E1E !important; border-color: #333333 !important; color: #f3f4f6 !important; }
        .custom-input:focus { border-color: #F4C7CC; }
        .dark body { background-color: #121212 !important; color: #f3f4f6 !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .pb-safe-offset-4 { padding-bottom: calc(env(safe-area-inset-bottom) + 1rem); }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-primaryPink selection:text-textDark overflow-x-hidden transition-colors duration-300">

    <div id="app-container" class="bg-bgCream dark:bg-darkBg w-full h-full">
        <header id="app-header" class="shrink-0 sticky top-0 z-20 bg-bgCream/90 dark:bg-darkSurface/90 backdrop-blur-md border-b border-primaryPink/30 dark:border-primaryPink/10 px-4 py-4 flex justify-between items-center shadow-sm"></header>
        <main id="app-content"></main>
        <nav id="app-bottom-nav" class="shrink-0 fixed bottom-0 w-full max-w-lg left-1/2 -translate-x-1/2 bg-white dark:bg-darkSurface border-t border-primaryPink/30 dark:border-primaryPink/10 shadow-[0_-4px_15px_rgba(244,199,204,0.1)] z-20 pb-safe"></nav>
    </div>
    <div id="modal-root" class="relative z-50"></div>

    <script>
        // =========================================================================
        const API_URL = "https://bot-cpzd.onrender.com"; // <-- ВСТАВЬ СЮДА ССЫЛКУ ИЗ RENDER.COM
        const ARTIST_TELEGRAM_ID = 5800436089; 
        // =========================================================================

        const I = {
            inbox: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>`,
            brush: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"></path><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"></path></svg>`,
            shield: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>`,
            pen: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>`,
            user: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
            coffee: `<svg class="w-12 h-12 text-primaryPink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"></path><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path><line x1="6" y1="2" x2="6" y2="4"></line><line x1="10" y1="2" x2="10" y2="4"></line><line x1="14" y1="2" x2="14" y2="4"></line></svg>`,
            checkCircle: `<svg class="w-12 h-12 text-primaryPink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>`,
            imagePlus: `<svg class="w-5 h-5 text-primaryPink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>`,
            send: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`,
            x: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>`,
            palette: `<svg class="w-6 h-6 text-darkBg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle><circle cx="8.5" cy="7.5" r=".5"></circle><circle cx="6.5" cy="12.5" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>`,
            moon: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>`,
            sun: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>`,
            clock: `<svg class="w-6 h-6 text-primaryPink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`,
            chevronLeft: `<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>`,
            chevronRight: `<svg class="w-5 h-5 opacity-30 text-textDark dark:text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>`,
            chevronDown: `<svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 opacity-50 pointer-events-none text-textDark dark:text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>`,
            sparkles: `<svg class="w-5 h-5 text-primaryPink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>`,
            trash: `<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>`
        };

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); try { tg.setHeaderColor(tg.colorScheme === 'dark' ? '#121212' : '#FDFBF7'); } catch (e) {} }

        const initData = tg?.initDataUnsafe || {};
        const tgUser = initData?.user?.id || Math.floor(Math.random() * 1000000000);
        const tgUserName = initData?.user?.first_name || 'Guest';
        const tgPhoto = initData?.user?.photo_url || null;
        const tgInitDataRaw = tg?.initData || "test_mode";

        const currentRole = (tgUser === ARTIST_TELEGRAM_ID) ? 'artist' : 'customer';

        let state = {
            lang: 'ru', isDark: tg?.colorScheme === 'dark', 
            tab: currentRole === 'artist' ? 'new_requests' : 'order_art', 
            view: 'main', activeOrderId: null, mockOrders: [], 
            draftType: 'portrait', draftDesc: '', draftImages: [], _lastDataStr: ""
        };

        const i18n = {
            ru: {
                appTitle: 'Арт Студия', tabOrder: 'Заказать', tabProfile: 'Профиль', tabNew: 'Новые заявки', tabActive: 'В работе', tabBanned: 'Заблокированные',
                emptyOrdersTitle: 'Пока нет заказов', emptyOrdersDesc: 'Заполните форму, чтобы сделать первый заказ.',
                emptyNewTitle: 'Все сделано!', emptyNewDesc: 'Новых заявок пока нет. Время отдохнуть!',
                emptyActiveTitle: 'Нет активных заказов', emptyActiveDesc: 'Примите заявки, чтобы они появились здесь.',
                emptyBannedTitle: 'Нет заблокированных', emptyBannedDesc: 'Список пуст.',
                formTitle: 'Оформить заказ', artType: 'Тип арта',
                types: { portrait: 'Портрет', halfBody: 'По пояс', fullBody: 'В полный рост', chibi: 'Чиби', sketch: 'Скетч', other: 'Другое' },
                description: 'Описание (Персонажи, позы...)', uploadBtn: 'Загрузить фото', submitBtn: 'Отправить заявку',
                filesAttached: 'фото', stats: 'Статистика', totalOrdered: 'Всего заказов', language: 'Язык',
                orderHistory: 'История заказов', darkMode: 'Темная тема', setPrice: 'Начальная цена', acceptOrder: 'Принять заказ', declineOrder: 'Отклонить', banUser: 'Забанить', unban: 'Разблокировать',
                unread: 'Новое', pending: 'Ожидает', accepted: 'В работе', banned: 'В бане', chatPlaceholder: 'Сообщение...', send: 'Отправить', priceSetAt: 'Цена:', back: 'Назад', status: 'Статус',
                success: 'Успешно!', orderSent: 'Ваша заявка отправлена.', currency: 'Валюта', byn: 'BYN', stars: 'Звезды',
                cancelOrder: 'Отменить заказ', submitArt: 'Сдать работу', watermarkWarning: 'ВНИМАНИЕ: Вы поставили водяной знак?',
                finalPrice: 'Итоговая цена', requestRevision: 'Доработать (Правки)', approvePay: 'Одобрить и Оплатить', cancelled: 'Отменен', completed: 'Завершен', inReview: 'На проверке', waitReview: 'Ожидает проверки клиентом',
                cancelConfirm: 'Вы уверены, что хотите отменить заказ?', submitFinalBtn: 'Сдать работу'
            }
        };

        const t = (key, nestedKey = null) => { const str = i18n['ru']; return nestedKey ? (str[key][nestedKey] || key) : (str[key] || key); };

        const compressImage = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height; const max = 800;
                    if (width > height && width > max) { height *= max / width; width = max; } 
                    else if (height > max) { width *= max / height; height = max; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                };
            };
        });

        const api = {
            sync: async () => {
                try {
                    const res = await fetch(`${API_URL}/api/sync?user_id=${tgUser}&init_data=${encodeURIComponent(tgInitDataRaw)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const newDataStr = JSON.stringify(data.orders);
                        if (state._lastDataStr !== newDataStr) {
                            state.mockOrders = data.orders; state._lastDataStr = newDataStr;
                            if (state.view === 'chat' && !document.getElementById('modal-root').innerHTML) {
                                const c = document.getElementById('chat-messages');
                                if (c) { c.innerHTML = renderChatMessagesOnly(); c.scrollTop = c.scrollHeight; }
                            } else App.render();
                        }
                    }
                } catch (e) {} 
            },
            postAction: async (endpoint, payload = {}) => {
                payload.initData = tgInitDataRaw; 
                try {
                    const res = await fetch(`${API_URL}${endpoint}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                    if(!res.ok) {
                        throw new Error(`Ошибка сервера: ${res.status}`);
                    }
                    await api.sync(); 
                } catch (e) { 
                    throw e; 
                }
            },
            createOrder: (type, desc, refs) => api.postAction(`/api/order`, { customerId: tgUser, customerName: tgUserName, customerPhoto: tgPhoto, type, description: desc, references: refs }),
            acceptOrder: (id, price, cur) => api.postAction(`/api/order/${id}/accept`, { price, currency: cur }),
            cancelOrder: (id) => api.postAction(`/api/order/${id}/cancel`),
            deleteOrder: (id) => api.postAction(`/api/order/${id}/delete`),
            declineOrder: (id) => api.postAction(`/api/order/${id}/decline`),
            submitFinalArt: (id, price) => api.postAction(`/api/order/${id}/submit`, { price }),
            requestRevision: (id) => api.postAction(`/api/order/${id}/revision`),
            completeOrder: (id) => api.postAction(`/api/order/${id}/complete`),
            banUser: (id) => api.postAction(`/api/order/${id}/ban`),
            unbanUser: (id) => api.postAction(`/api/order/${id}/unban`),
            markAsRead: (id) => api.postAction(`/api/order/${id}/read`),
            sendMessage: (id, text, photoStr) => api.postAction(`/api/order/${id}/message`, { text, photo: photoStr }) 
        };

        const UI = {
            showAlert: (message) => {
                const root = document.getElementById('modal-root');
                root.innerHTML = `<div class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50"><div class="bg-white dark:bg-darkSurface dark:text-gray-100 p-6 rounded-3xl shadow-xl max-w-sm w-full border border-primaryPink/20 animate-[slideUp_0.2s_ease-out]"><h3 class="font-bold text-lg mb-2">Внимание</h3><p class="text-sm opacity-80 mb-6">${message}</p><button onclick="document.getElementById('modal-root').innerHTML=''" class="w-full bg-primaryPink text-textDark font-bold py-3 rounded-xl active:scale-95 transition-transform">OK</button></div></div>`;
            },
            showConfirm: (msg, onConfirm) => {
                const root = document.getElementById('modal-root');
                window._cf = () => { root.innerHTML = ''; onConfirm(); };
                window._cl = () => { root.innerHTML = ''; };
                root.innerHTML = `<div class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50"><div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-xl max-w-sm w-full animate-[slideUp_0.2s_ease-out] border border-primaryPink/20"><h3 class="font-bold text-lg mb-2 text-textDark dark:text-white">Подтверждение</h3><p class="text-sm opacity-80 mb-6 text-textDark dark:text-gray-300">${msg}</p><div class="flex gap-3"><button onclick="window._cl()" class="flex-1 bg-bgCream dark:bg-darkBg text-textDark dark:text-white border border-primaryPink/20 font-bold py-3 rounded-xl active:scale-95 transition-transform">Отмена</button><button onclick="window._cf()" class="flex-1 bg-primaryPink text-darkBg font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform">Да</button></div></div></div>`;
            },
            showSubmitArtModal: (order, onConfirm) => {
                const root = document.getElementById('modal-root');
                window._sa = () => { root.innerHTML=''; onConfirm(document.getElementById('finalPriceInput').value); };
                root.innerHTML = `<div class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50"><div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-xl max-w-sm w-full animate-[slideUp_0.2s_ease-out] border border-primaryPink/20"><div class="w-12 h-12 bg-primaryPink/20 rounded-full flex items-center justify-center mb-4">${I.checkCircle}</div><h3 class="font-bold text-lg mb-2 text-textDark dark:text-white">${t('submitArt')}</h3><p class="text-sm text-softRedText bg-softRed/10 p-3 rounded-xl border border-softRed mb-4 font-medium flex gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i> ${t('watermarkWarning')}</p><label class="block text-sm font-bold mb-2 text-textDark dark:text-white">${t('finalPrice')} (${order.currency === 'Stars' ? '⭐' : order.currency})</label><input type="number" id="finalPriceInput" class="custom-input font-bold text-lg mb-6" value="${order.price}" min="0"><div class="flex gap-3"><button onclick="document.getElementById('modal-root').innerHTML=''" class="flex-1 bg-bgCream dark:bg-darkBg text-textDark dark:text-white border border-primaryPink/20 font-bold py-3 rounded-xl active:scale-95">Назад</button><button onclick="window._sa()" class="flex-[2] bg-primaryPink text-darkBg font-bold py-3 rounded-xl active:scale-95">${t('submitFinalBtn')}</button></div></div></div>`;
            }
        };

        const formatPrice = (p, c) => p ? (c === 'Stars' ? `${p} ⭐` : `${p} ${c}`) : '';
        const getAvatar = (url, name, s='10') => url ? `<img src="${url}" class="w-${s} h-${s} rounded-full border-2 border-primaryPink object-cover shrink-0">` : `<div class="w-${s} h-${s} bg-bgCream dark:bg-darkBg rounded-full border-2 border-primaryPink flex items-center justify-center shrink-0">${I.user}</div>`;

        function renderHeader() {
            const header = document.getElementById('app-header');
            if (state.view !== 'main') {
                const order = state.mockOrders.find(o => o.id === state.activeOrderId);
                let extraInfo = ''; let cancelBtn = '';
                if (order) {
                    if (state.view === 'chat' && order.price && ['accepted', 'in_review'].includes(order.status)) extraInfo = `<div class="bg-primaryPink/20 text-primaryPink font-bold px-3 py-1 rounded-full text-sm">${formatPrice(order.price, order.currency)}</div>`;
                    if (['pending', 'accepted'].includes(order.status)) cancelBtn = `<button onclick="App.cancelCurrentOrder()" class="p-2 text-softRedText hover:bg-softRed/10 rounded-full">${I.x}</button>`;
                }
                header.innerHTML = `<div class="flex items-center text-textDark dark:text-white"><button onclick="App.goBack()" class="p-2 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5">${I.chevronLeft}</button><h1 class="font-bold text-lg truncate mx-2">${order ? t('types', order.type) : t('back')}</h1>${extraInfo}</div><div>${cancelBtn}</div>`;
            } else {
                let rightAction = currentRole === 'artist' ? `<button onclick="App.toggleTheme()" class="p-2 rounded-full border border-primaryPink/20 hover:bg-black/5 dark:hover:bg-white/5 text-textDark dark:text-white"><div class="w-5 h-5 flex items-center justify-center">${state.isDark? I.sun : I.moon}</div></button>` : '';
                header.innerHTML = `<div class="flex items-center gap-3"><div class="w-10 h-10 bg-primaryPink rounded-2xl flex items-center justify-center">${I.palette}</div><h1 class="font-bold text-xl text-textDark dark:text-white">${t('appTitle')}</h1></div><div class="flex items-center gap-2">${rightAction}</div>`;
            }
        }

        function renderBottomNav() {
            const nav = document.getElementById('app-bottom-nav');
            if (state.view !== 'main') { nav.innerHTML = ''; return; }
            let tabsHTML = '';
            if (currentRole === 'artist') {
                const unread = state.mockOrders.filter(o => o.status === 'pending' && !o.isRead).length;
                tabsHTML = `
                    <button onclick="App.switchTab('new_requests')" class="flex-1 py-4 flex flex-col items-center gap-1 ${state.tab === 'new_requests' ? 'text-primaryPink opacity-100' : 'opacity-40 text-textDark dark:text-white'} transition-all">

            return `<div class="flex flex-col items-center justify-center p-10 text-center animate-[fadeIn_0.5s_ease-out]"><div class="w-24 h-24 bg-primaryPink/10 rounded-full flex items-center justify-center mb-6">${iconSvg}</div><h3 class="font-bold text-xl mb-2 text-textDark dark:text-white">${title}</h3><p class="text-sm opacity-60 max-w-[200px] leading-relaxed text-textDark dark:text-gray-300">${desc}</p></div>`;
        }

                imagesPreview = `<div class="flex gap-3 mt-4 overflow-x-auto pb-2">`;

            return `

                                    ${I.imagePlus}

        function renderCustomerProfile() {
            const orders = state.mockOrders.filter(o => o.customerId === tgUser).slice().reverse();
            let html = orders.length ? orders.map(o => `
                <div onclick="App.openOrder('${o.id}')" class="bg-white dark:bg-darkSurface p-4 rounded-2xl mb-3 shadow-sm border border-primaryPink/10 dark:border-primaryPink/20 cursor-pointer flex items-center justify-between">
                    <div>
                        <div class="font-bold mb-1 text-textDark dark:text-white">${t('types', o.type)}</div>
                        <div class="text-xs px-2 py-1 bg-bgCream dark:bg-darkBg text-textDark dark:text-gray-100 rounded-md border border-primaryPink/20 inline-block opacity-80">${t(o.status)}</div>

            return `
                <div class="p-4 space-y-6 animate-[fadeIn_0.3s_ease-out] pb-32">

                        <div class="flex items-center gap-4">${getAvatar(tgPhoto, tgUserName, '14')}<div><h3 class="font-bold text-lg text-textDark dark:text-white">${tgUserName}</h3></div></div>
                        <div class="flex flex-col gap-2 items-end">
                            <button onclick="App.toggleTheme()" class="flex items-center gap-2 text-xs font-bold bg-bgCream dark:bg-darkBg text-textDark dark:text-gray-200 px-3 py-1.5 rounded-lg border border-primaryPink/20">${state.isDark? I.sun : I.moon} ${t('darkMode')}</button>
                        </div>
                    </div>
                    <div><h3 class="font-bold text-sm ml-2 mb-3 opacity-60 uppercase text-textDark dark:text-white">${t('orderHistory')}</h3>${html}</div>

        function renderArtistList() {
            let emptyTitle, emptyDesc, emptyIcon;
            let statusFilter = [];
            
            // Жестко привязываем пустые экраны к вкладке
            if (state.tab === 'new_requests') {
                statusFilter = ['pending'];
                emptyTitle = t('emptyNewTitle'); emptyDesc = t('emptyNewDesc'); emptyIcon = I.coffee;
            } else if (state.tab === 'banned') {
                statusFilter = ['banned'];
                emptyTitle = t('emptyBannedTitle'); emptyDesc = t('emptyBannedDesc'); emptyIcon = I.shield;
            } else {
                statusFilter = ['accepted', 'in_review', 'completed', 'cancelled'];
                emptyTitle = t('emptyActiveTitle'); emptyDesc = t('emptyActiveDesc'); emptyIcon = I.checkCircle;
            }
            
            const orders = state.mockOrders.filter(o => statusFilter.includes(o.status)).slice().reverse();

            if (!orders.length) return renderEmptyState(emptyTitle, emptyDesc, emptyIcon);

            return `<div class="p-4 space-y-3 animate-[fadeIn_0.3s_ease-out] pb-32">${orders.map(o => `
                <div ${state.tab !== 'banned' ? `onclick="App.openOrder('${o.id}')"` : ''} class="bg-white dark:bg-darkSurface p-5 rounded-2xl shadow-sm border ${!o.isRead && state.tab==='new_requests' ? 'border-primaryPink shadow-[0_0_10px_rgba(244,199,204,0.3)] dark:shadow-none' : 'border-primaryPink/10 dark:border-primaryPink/20'} relative overflow-hidden${['completed', 'cancelled'].includes(o.status) ? 'opacity-60' : ''} cursor-pointer">
                    ${!o.isRead && state.tab === 'new_requests' ? `<div class="absolute top-5 right-5 w-3 h-3 bg-primaryPink rounded-full glowing-dot"></div>` : ''}
                    <div class="flex justify-between items-start mb-3 pr-6 text-textDark dark:text-white">
                        <div><h3 class="font-bold text-lg">${t('types', o.type)}</h3><div class="flex items-center gap-2 mt-1">${getAvatar(o.customerPhoto, o.customerName, '4')}<p class="text-xs opacity-60">${o.customerName}</p></div></div>
                        <div class="flex flex-col items-end gap-1">${o.price ? `<span class="font-bold bg-primaryPink/20 text-primaryPink px-2 py-0.5 rounded text-sm">${formatPrice(o.price, o.currency)}</span>` : ''}${state.tab === 'active_works' ? `<span class="text-[10px] font-bold uppercase opacity-60">${t(o.status)}</span>` : ''}</div>
                    </div>
                    <p class="text-sm opacity-80 line-clamp-2 leading-relaxed bg-bgCream dark:bg-darkBg p-3 rounded-xl border border-primaryPink/5 text-textDark dark:text-gray-200">${o.description}</p>
                    <div class="mt-4 flex items-center justify-between text-xs font-medium text-textDark dark:text-gray-300">
                        <span>${formatDate(o.date)}</span>${state.tab === 'banned' ? `<button onclick="App.unbanUser('${o.id}')" class="px-4 py-2 bg-textDark dark:bg-white text-white dark:text-darkBg rounded-lg font-bold">${t('unban')}</button>` : `<span class="flex items-center gap-1 opacity-50">${state.tab === 'new_requests' ? 'Review' : 'Open'} ${I.chevronRight}</span>`}
                    </div>
                </div>`).join('')}</div>`;
        }

        function renderOrderDetail() {
            const order = state.mockOrders.find(o => o.id === state.activeOrderId);
            if (!order) return '';
            const isPending = order.status === 'pending';
            let actions = '';

            if (currentRole === 'artist' && isPending) {
                actions = `
                    <div class="mt-8 space-y-4">
                        <div class="bg-white dark:bg-darkSurface p-5 rounded-2xl border border-primaryPink"><label class="block text-sm font-bold mb-3 text-textDark dark:text-white">${t('setPrice')}</label>
                            <div class="flex gap-2"><input type="number" id="priceInput" class="custom-input font-bold text-lg flex-1" placeholder="0" min="1"><select id="currencyInput" class="custom-input font-bold w-28 text-center appearance-none"><option value="BYN">BYN</option><option value="Stars">⭐</option></select></div>
                            <button onclick="App.acceptCurrentOrder()" class="w-full mt-4 bg-primaryPink text-darkBg font-bold py-4 rounded-xl active:scale-95">${t('acceptOrder')}</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3"><button onclick="api.declineOrder('${order.id}'); App.goBack();" class="bg-white dark:bg-darkSurface text-textDark dark:text-white border-2 border-primaryPink/20 font-bold py-3 rounded-xl active:scale-95">${t('declineOrder')}</button><button onclick="UI.showConfirm('${t('banUser')}?', ()=>{api.banUser('${order.id}'); App.goBack();})" class="bg-white dark:bg-darkSurface border-2 border-softRed text-softRedText font-bold py-3 rounded-xl active:scale-95">${t('banUser')}</button></div>
                    </div>`;
            } else if (currentRole === 'customer' && isPending) {
                actions = `<div class="mt-8 text-center p-6 bg-bgCream dark:bg-darkBg rounded-2xl border border-primaryPink/20 text-textDark dark:text-white"><div class="inline-flex items-center justify-center w-12 h-12 bg-primaryPink/30 rounded-full mb-3">${I.clock}</div><h3 class="font-bold text-lg mb-1">Ожидаем художника</h3></div>`;
            }

            const refsHtml = (order.references && order.references.length) ? `<div class="mt-4"><h3 class="text-xs font-bold uppercase opacity-50 mb-2 text-textDark dark:text-gray-200">Фото</h3><div class="flex gap-2 overflow-x-auto pb-2">${order.references.map(img => `<img src="${img}" class="w-20 h-20 object-cover rounded-lg border border-primaryPink/30">`).join('')}</div></div>` : '';

            return `
                <div class="p-4 animate-[slideInRight_0.3s_ease-out] pb-32">
                    <div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-sm border border-primaryPink/10 dark:border-primaryPink/20 relative">
                        <div class="absolute top-6 right-6 bg-bgCream dark:bg-darkBg px-3 py-1 rounded-lg border border-primaryPink/20 text-xs font-bold uppercase opacity-80 text-textDark dark:text-white">${t(order.status)}</div>
                        <div class="mb-6 pr-20 text-textDark dark:text-white"><h2 class="text-2xl font-bold mb-2">${t('types', order.type)}</h2><div class="flex items-center gap-2 mb-1">${getAvatar(order.customerPhoto, order.customerName, '6')}<p class="text-sm font-medium opacity-80">${order.customerName}</p></div></div>
                        <div class="bg-bgCream dark:bg-darkBg p-4 rounded-xl border border-primaryPink/10"><p class="text-sm leading-relaxed whitespace-pre-wrap text-textDark dark:text-gray-200">${order.description}</p></div>
                        ${refsHtml} ${actions}
                    </div>
                </div>`;
        }

        function renderChatMessagesOnly() {
            const order = state.mockOrders.find(o => o.id === state.activeOrderId);
            if (!order) return '';
            const msgs = order.messages.map(m => {
                if (m.sender === 'system') return `<div class="flex justify-center my-4"><span class="bg-primaryPink/20 border border-primaryPink/30 text-textDark dark:text-white text-xs font-bold px-4 py-1.5 rounded-full text-center">${m.text}</span></div>`;
                const isMe = m.sender === currentRole;
                const photo = m.photo ? `<img src="${m.photo}" class="w-full rounded-lg mb-2 border border-black/10">` : '';
                return `
                    <div class="flex w-full mb-4 ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] rounded-2xl px-4 py-2.5 shadow-sm ${isMe ? 'bg-primaryPink text-darkBg rounded-tr-sm' : 'bg-white dark:bg-darkSurface text-textDark dark:text-gray-100 dark:border-primaryPink/25 border border-primaryPink/10 rounded-tl-sm'}">
                            ${photo}<p class="text-sm leading-relaxed whitespace-pre-wrap break-words">${m.text}</p>${m.date ? `<p class="text-[10px] opacity-50 mt-1 text-right">${formatDate(m.date).split(',')[1]}</p>` : ''}
                        </div>
                    </div>`;
            }).join('');
            return msgs.length ? msgs : renderEmptyState('Чат', 'Здесь можно обсудить детали.', I.coffee);
        }

        function renderChat() {
            const order = state.mockOrders.find(o => o.id === state.activeOrderId);
            if (!order) return '';

            let controls = '';
            if (order.status === 'accepted') {
                if (currentRole === 'artist') {
                    controls = `
                        <div class="bg-white dark:bg-darkSurface border-t border-primaryPink/30 p-3 shrink-0">
                            <button onclick="UI.showSubmitArtModal(state.mockOrders.find(o=>o.id==='${order.id}'), (p) => { api.submitFinalArt('${order.id}', p); App.render(); })" class="w-full bg-bgCream dark:bg-darkBg border border-primaryPink/30 text-textDark dark:text-white font-bold py-2 rounded-xl text-sm mb-3 flex justify-center items-center gap-2 hover:bg-primaryPink/10">${t('submitArt')}</button>
                            <div class="flex gap-2 items-end">
                                <label class="cursor-pointer p-3 bg-bgCream dark:bg-darkBg text-textDark dark:text-white rounded-xl border border-primaryPink/30 shrink-0 hover:bg-primaryPink/10"><input type="file" id="chatPhoto" class="hidden" accept="image/png, image/jpeg, image/jpg">${I.imagePlus}</label>
                                <textarea id="chatInput" rows="1" class="flex-1 custom-input resize-none py-3" placeholder="${t('chatPlaceholder')}" oninput="this.style.height=''; this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
                                <button onclick="App.sendChat()" class="bg-primaryPink text-darkBg w-12 h-12 rounded-xl flex items-center justify-center shrink-0 active:scale-95">${I.send}</button>
                            </div>
                        </div>`;
                } else {
                    controls = `
                        <div class="bg-white dark:bg-darkSurface border-t border-primaryPink/30 p-3 shrink-0 flex gap-2 items-end pb-safe-offset-4">
                            <label class="cursor-pointer p-3 bg-bgCream dark:bg-darkBg text-textDark dark:text-white rounded-xl border border-primaryPink/30 shrink-0 hover:bg-primaryPink/10"><input type="file" id="chatPhoto" class="hidden" accept="image/png, image/jpeg, image/jpg">${I.imagePlus}</label>
                            <textarea id="chatInput" rows="1" class="flex-1 custom-input resize-none py-3" placeholder="${t('chatPlaceholder')}" oninput="this.style.height=''; this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
                            <button onclick="App.sendChat()" class="bg-primaryPink text-darkBg w-12 h-12 rounded-xl flex items-center justify-center shrink-0 active:scale-95">${I.send}</button>
                        </div>`;
                }
            } else if (order.status === 'in_review') {
                if (currentRole === 'customer') controls = `<div class="p-3 bg-white dark:bg-darkSurface border-t border-primaryPink/30 flex gap-2 pb-safe-offset-4"><button onclick="api.requestRevision('${order.id}'); App.render();" class="flex-1 border-2 border-primaryPink/40 text-textDark dark:text-white font-bold py-3 rounded-xl active:scale-95">${t('requestRevision')}</button><button onclick="UI.showConfirm('Одобрить заказ?', ()=>{api.completeOrder('${order.id}'); App.render();})" class="flex-[1.5] bg-primaryPink text-darkBg font-bold py-3 rounded-xl active:scale-95 shadow-md">${t('approvePay')}</button></div>`;
                else controls = `<div class="p-4 text-center text-sm font-bold opacity-60 pb-safe-offset-4 text-textDark dark:text-white">${t('waitReview')}</div>`;
            } else if (['completed', 'cancelled'].includes(order.status)) {
                controls = `<div class="p-4 text-center text-sm font-bold opacity-60 pb-safe-offset-4 text-textDark dark:text-white">${t(order.status)}</div>`;
            }

            return `<div class="flex flex-col h-full overflow-hidden w-full"><div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col">${renderChatMessagesOnly()}</div>${controls}</div>`;
        }

        const App = {
            init: () => { 
                if (state.isDark) document.documentElement.classList.add('dark');
                App.render(); 
                api.sync(); 
                setInterval(api.sync, 2000); 
            },
            render: () => {
                renderHeader(); renderBottomNav();
                const content = document.getElementById('app-content');
                if (state.view === 'main') {
                    if (currentRole === 'artist') content.innerHTML = renderArtistList();
                    else content.innerHTML = state.tab === 'order_art' ? renderCustomerForm() : renderCustomerProfile();
                } else if (state.view === 'order_detail') content.innerHTML = renderOrderDetail();
                else if (state.view === 'chat') {
                    content.innerHTML = renderChat();
                    setTimeout(() => { const c = document.getElementById('chat-messages'); if(c) c.scrollTop = c.scrollHeight; }, 50);
                }
            },
            switchTab: (id) => { 
                state.draftDesc = ''; 
                state.draftImages = []; 
                state.draftType = 'portrait';
                
                state.tab = id; 
                state.view = 'main'; 
                state.activeOrderId = null; 
                App.render(); 
            },
            setLang: (l) => { state.lang = l; App.render(); },
            toggleTheme: () => { 
                state.isDark = !state.isDark; 
                document.documentElement.classList.toggle('dark', state.isDark); 
                App.render(); 
            },
            openOrder: (id) => {
                state.activeOrderId = id; const o = state.mockOrders.find(x => x.id === id);
                if (currentRole === 'artist' && o.status === 'pending' && !o.isRead) api.markAsRead(id);
                state.view = ['accepted', 'in_review', 'completed', 'cancelled'].includes(o.status) ? 'chat' : 'order_detail';
                App.render();
            },
            goBack: () => { state.view = 'main'; state.activeOrderId = null; App.render(); },
            
            handleFormUpload: async (e) => {
                const files = Array.from(e.target.files).slice(0, 3);
                const newImages = await Promise.all(files.map(f => compressImage(f)));
                state.draftImages = [...state.draftImages, ...newImages].slice(0, 3);
                App.render();
            },
            removeDraftImage: (index) => {
                state.draftImages.splice(index, 1);
                App.render();
            },
            submitOrder: async (e) => {
                e.preventDefault();
                
                const btn = document.getElementById('submitBtn');
                const btnText = document.getElementById('submitText');
                const btnIcon = document.getElementById('submitIcon');
                btn.disabled = true;
                btn.classList.add('opacity-50');
                btnText.innerText = 'Отправка... (может занять до 1 мин)';
                if(btnIcon) btnIcon.innerHTML = ''; 

                try {
                    await api.createOrder(document.getElementById('formType').value, document.getElementById('formDesc').value, state.draftImages);
                    state.draftImages = []; 
                    state.draftDesc = ''; 
                    state.draftType = 'portrait';
                    document.getElementById('orderForm').reset(); 
                    if(tg && tg.showAlert) tg.showAlert(t('orderSent')); else UI.showAlert(t('orderSent'));
                    App.switchTab('profile'); 
                } catch(err) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50');
                    btnText.innerText = t('submitBtn');
                    if(btnIcon) btnIcon.innerHTML = I.send;
                }
            },
            acceptCurrentOrder: () => {
                const p = parseFloat(document.getElementById('priceInput').value);
                if(isNaN(p) || p<=0) return alert('Укажите цену.');
                api.acceptOrder(state.activeOrderId, p, document.getElementById('currencyInput').value);
                state.view = 'chat'; App.render();
            },
            cancelCurrentOrder: () => { UI.showConfirm(t('cancelConfirm'), () => { api.cancelOrder(state.activeOrderId); App.render(); }); },
            deleteOrder: (id) => { UI.showConfirm('Удалить этот заказ навсегда?', () => { api.deleteOrder(id); App.render(); }); },
            unbanUser: (id) => { UI.showConfirm('Разблокировать?', () => { api.unbanUser(id); App.render(); }); },

            sendChat: async () => {
                const input = document.getElementById('chatInput');
                const photoInput = document.getElementById('chatPhoto');
                const text = input.value.trim();
                let photoStr = null;

                if (photoInput && photoInput.files.length) {
                    photoStr = await compressImage(photoInput.files[0]);
                }
                if (text || photoStr) {
                    api.sendMessage(state.activeOrderId, text, photoStr);
                    input.value = ''; input.style.height = ''; if(photoInput) photoInput.value = '';
                    const o = state.mockOrders.find(x => x.id === state.activeOrderId);
                    o.messages.push({ sender: currentRole, text: text, photo: photoStr, date: new Date().toISOString() });
                    const chatDiv = document.getElementById('chat-messages');
                    if (chatDiv) { chatDiv.innerHTML = renderChatMessagesOnly(); chatDiv.scrollTop = chatDiv.scrollHeight; }
                }
            }
        };

        window.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
</html>
