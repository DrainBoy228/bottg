<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Artist Commission Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bgCream: '#FDFBF7', primaryPink: '#F4C7CC', textDark: '#4A4345', softRed: '#ffc1c1', softRedText: '#d9534f',
                        darkBg: '#121212', darkPink: '#A5737A', darkSurface: '#1E1E1E'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; background-color: #FDFBF7; color: #4A4345; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s; }
        #app-container { display: flex; flex-direction: column; height: 100dvh; max-width: 32rem; margin: 0 auto; }
        #app-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #F4C7CC; border-radius: 4px; }
        .glowing-dot { box-shadow: 0 0 8px #F4C7CC, 0 0 12px #F4C7CC; animation: pulse-glow 2s infinite; }
        .dark .glowing-dot { box-shadow: 0 0 8px #A5737A, 0 0 12px #A5737A; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }
        .custom-input { width: 100%; background-color: white; border: 2px solid #FDFBF7; border-radius: 0.75rem; padding: 0.75rem 1rem; color: #4A4345; outline: none; transition: border-color 0.2s ease; }
        .custom-input:focus { border-color: #F4C7CC; }
        .dark { background-color: #121212; color: #f3f4f6; }
        .dark body { background-color: #121212; color: #f3f4f6; }
        .dark .custom-input { background-color: #1E1E1E !important; border-color: #333333 !important; color: #f3f4f6 !important; }
        .dark .custom-input:focus { border-color: #A5737A !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="selection:bg-primaryPink selection:text-textDark transition-colors duration-300">

    <div id="app-container" class="bg-bgCream dark:bg-darkBg w-full h-full">
        <header id="app-header" class="shrink-0 z-20 bg-bgCream/90 dark:bg-darkBg/90 backdrop-blur-md border-b border-primaryPink/30 dark:border-primaryPink/10 px-4 py-4 flex justify-between items-center shadow-sm"></header>
        <main id="app-content"></main>
        <nav id="app-bottom-nav" class="shrink-0 w-full bg-white dark:bg-darkSurface border-t border-primaryPink/30 dark:border-primaryPink/10 shadow-[0_-4px_15px_rgba(244,199,204,0.1)] z-20 pb-[env(safe-area-inset-bottom)]"></nav>
    </div>
    <div id="modal-root" class="relative z-50"></div>

    <script>
        // =========================================================================
        const API_URL = "71380c1b3b4891.lhr.life"; // <--- ВСТАВЬ СЮДА ССЫЛКУ ИЗ ЧЕРНОГО ОКНА LHR
        const ARTIST_TELEGRAM_ID = 5800436089; 
        // =========================================================================

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); try { tg.setHeaderColor(tg.colorScheme === 'dark' ? '#121212' : '#FDFBF7'); } catch (e) {} }

        const initData = tg?.initDataUnsafe || {};
        const tgUser = initData?.user?.id || Math.floor(Math.random() * 1000000000);
        const tgUserName = initData?.user?.first_name || 'Guest';
        const tgPhoto = initData?.user?.photo_url || null;
        const tgInitDataRaw = tg?.initData || "test_mode";

        const currentRole = (tgUser === ARTIST_TELEGRAM_ID) ? 'artist' : 'customer';

        let state = {
            lang: 'ru', isDark: tg?.colorScheme === 'dark', 
            tab: currentRole === 'artist' ? 'new_requests' : 'order_art', 
            view: 'main', activeOrderId: null, mockOrders: [], draftImages: [], _lastDataStr: ""
        };

        const i18n = {
            ru: {
                appTitle: 'Арт Студия', tabOrder: 'Заказать', tabProfile: 'Профиль', tabNew: 'Новые заявки', tabActive: 'В работе', tabBanned: 'В бане',
                emptyOrdersTitle: 'Пока нет заказов', emptyOrdersDesc: 'Заполните форму, чтобы сделать первый заказ.',
                emptyNewTitle: 'Все сделано!', emptyNewDesc: 'Новых заявок пока нет. Время отдохнуть!',
                emptyActiveTitle: 'Нет активных заказов', emptyActiveDesc: 'Примите заявки, чтобы они появились здесь.',
                emptyBannedTitle: 'Нет заблокированных', emptyBannedDesc: 'Список пуст.',
                formTitle: 'Оформить заказ', artType: 'Тип арта',
                types: { portrait: 'Портрет', halfBody: 'По пояс', fullBody: 'В полный рост', chibi: 'Чиби', sketch: 'Скетч', other: 'Другое' },
                description: 'Описание (Персонажи, позы...)', uploadBtn: 'Загрузить фото', submitBtn: 'Отправить заявку',
                filesAttached: 'фото', stats: 'Статистика', totalOrdered: 'Всего заказов', language: 'Язык',
                orderHistory: 'История заказов', darkMode: 'Темная тема', setPrice: 'Начальная цена', acceptOrder: 'Принять заказ', declineOrder: 'Отклонить', banUser: 'Забанить', unban: 'Разблокировать',
                unread: 'Новое', pending: 'Ожидает', accepted: 'В работе', banned: 'В бане', chatPlaceholder: 'Сообщение...', send: 'Отправить', priceSetAt: 'Цена:', back: 'Назад', status: 'Статус',
                success: 'Успешно!', orderSent: 'Ваша заявка отправлена.', currency: 'Валюта', byn: 'BYN', stars: 'Звезды',
                cancelOrder: 'Отменить заказ', submitArt: 'Сдать работу', watermarkWarning: 'ВНИМАНИЕ: Вы поставили водяной знак?',
                finalPrice: 'Итоговая цена', requestRevision: 'Доработать (Правки)', approvePay: 'Одобрить и Оплатить', cancelled: 'Отменен', completed: 'Завершен', inReview: 'На проверке', waitReview: 'Ожидает проверки клиентом',
                cancelConfirm: 'Вы уверены, что хотите отменить заказ?', submitFinalBtn: 'Сдать работу'
            },
            en: {
                appTitle: 'Commission Studio', tabOrder: 'Order Art', tabProfile: 'Profile', tabNew: 'New Requests', tabActive: 'Active Works', tabBanned: 'Banned',
                emptyOrdersTitle: 'No Orders Yet', emptyOrdersDesc: 'Fill out the form to commission your first artwork.',
                emptyNewTitle: 'All Caught Up!', emptyNewDesc: 'No new requests right now. Time to relax!',
                emptyActiveTitle: 'No Active Works', emptyActiveDesc: 'Accept some requests to see them here.',
                emptyBannedTitle: 'No Banned Users', emptyBannedDesc: 'You have not banned anyone.',
                formTitle: 'Request a Commission', artType: 'Art Type',
                types: { portrait: 'Portrait', halfBody: 'Half Body', fullBody: 'Full Body', chibi: 'Chibi', sketch: 'Sketch', other: 'Other' },
                description: 'Description', uploadBtn: 'Upload References', submitBtn: 'Submit Request',
                filesAttached: 'images', stats: 'Your Stats', totalOrdered: 'Total Ordered', language: 'Language',
                orderHistory: 'Order History', darkMode: 'Dark Mode', setPrice: 'Set Price', acceptOrder: 'Accept Order', declineOrder: 'Decline', banUser: 'Ban User', unban: 'Unban',
                unread: 'New', pending: 'Pending', accepted: 'Accepted', banned: 'Banned', chatPlaceholder: 'Message...', send: 'Send', priceSetAt: 'Price:', back: 'Back',
                success: 'Success!', orderSent: 'Your request has been sent.', currency: 'Currency', byn: 'BYN', stars: 'Stars',
                cancelOrder: 'Cancel Order', submitArt: 'Submit Artwork', watermarkWarning: 'WARNING: Did you add a watermark?',
                finalPrice: 'Final Price', requestRevision: 'Request Revision', approvePay: 'Approve & Pay', cancelled: 'Cancelled', completed: 'Completed', inReview: 'In Review', waitReview: 'Waiting for Customer Review',
                cancelConfirm: 'Are you sure you want to cancel this order?', submitFinalBtn: 'Submit to Customer'
            }
        };

        const t = (key, nestedKey = null) => { const str = i18n[state.lang] || i18n['ru']; return nestedKey ? (str[key][nestedKey] || key) : (str[key] || key); };

        const compressImage = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height; const max = 800;
                    if (width > height && width > max) { height *= max / width; width = max; } 
                    else if (height > max) { width *= max / height; height = max; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                };
            };
        });

        const api = {
            sync: async () => {
                try {
                    const res = await fetch(`${API_URL}/api/sync?user_id=${tgUser}&init_data=${encodeURIComponent(tgInitDataRaw)}`);
                    if (res.ok) {
                        const data = await res.json();
                        const newDataStr = JSON.stringify(data.orders);
                        if (state._lastDataStr !== newDataStr) {
                            state.mockOrders = data.orders; state._lastDataStr = newDataStr;
                            if (state.view === 'chat' && !document.getElementById('modal-root').innerHTML) {
                                const c = document.getElementById('chat-messages');
                                if (c) { c.innerHTML = renderChatMessagesOnly(); c.scrollTop = c.scrollHeight; }
                            } else App.render();
                        }
                    }
                } catch (e) {} 
            },
            postAction: async (endpoint, payload = {}) => {
                payload.initData = tgInitDataRaw; 
                try {
                    const res = await fetch(`${API_URL}${endpoint}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                    if(!res.ok) throw new Error("HTTP Error " + res.status);
                    await api.sync();
                } catch (e) { 
                    UI.showAlert("❌ ОШИБКА СЕТИ: Заказ не отправлен. Убедитесь, что сервер запущен и вы обновили ссылку на github.");
                    throw e; // Жестко прерываем функцию, чтобы не было фейкового сообщения "Успех"
                }
            },
            createOrder: (type, desc, refs) => api.postAction(`/api/order`, { customerId: tgUser, customerName: tgUserName, customerPhoto: tgPhoto, type, description: desc, references: refs }),
            acceptOrder: (id, price, cur) => api.postAction(`/api/order/${id}/accept`, { price, currency: cur }),
            cancelOrder: (id) => api.postAction(`/api/order/${id}/cancel`),
            declineOrder: (id) => api.postAction(`/api/order/${id}/decline`),
            submitFinalArt: (id, price) => api.postAction(`/api/order/${id}/submit`, { price }),
            requestRevision: (id) => api.postAction(`/api/order/${id}/revision`),
            completeOrder: (id) => api.postAction(`/api/order/${id}/complete`),
            banUser: (id) => api.postAction(`/api/order/${id}/ban`),
            unbanUser: (id) => api.postAction(`/api/order/${id}/unban`),
            markAsRead: (id) => api.postAction(`/api/order/${id}/read`),
            sendMessage: (id, text, photoStr) => api.postAction(`/api/order/${id}/message`, { text, photo: photoStr }) 
        };

        const UI = {
            showAlert: (message) => {
                const root = document.getElementById('modal-root');
                root.innerHTML = `
                    <div class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
                        <div class="bg-white dark:bg-darkSurface dark:text-gray-100 p-6 rounded-3xl shadow-xl max-w-sm w-full border border-primaryPink/20 animate-[slideUp_0.2s_ease-out]">
                            <h3 class="font-bold text-lg mb-2">Внимание</h3>
                            <p class="text-sm opacity-80 mb-6">${message}</p>
                            <button onclick="document.getElementById('modal-root').innerHTML=''" class="w-full bg-primaryPink text-textDark font-bold py-3 rounded-xl active:scale-95 transition-transform">OK</button>
                        </div>
                    </div>
                `;
            },
            showConfirm: (msg, onConfirm) => {
                const root = document.getElementById('modal-root');
                window._cf = () => { root.innerHTML = ''; onConfirm(); };
                window._cl = () => { root.innerHTML = ''; };
                root.innerHTML = `
                    <div class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
                        <div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-xl max-w-sm w-full animate-[slideUp_0.2s_ease-out] border border-primaryPink/20">
                            <h3 class="font-bold text-lg mb-2 text-textDark dark:text-white">Подтверждение</h3>
                            <p class="text-sm opacity-80 mb-6 text-textDark dark:text-gray-300">${msg}</p>
                            <div class="flex gap-3">
                                <button onclick="window._cl()" class="flex-1 bg-bgCream dark:bg-darkBg text-textDark dark:text-white border border-primaryPink/20 font-bold py-3 rounded-xl active:scale-95 transition-transform">Отмена</button>
                                <button onclick="window._cf()" class="flex-1 bg-primaryPink text-darkBg font-bold py-3 rounded-xl shadow-md active:scale-95 transition-transform">Да</button>
                            </div>
                        </div>
                    </div>`;
            },
            showSubmitArtModal: (order, onConfirm) => {
                const root = document.getElementById('modal-root');
                window._sa = () => { root.innerHTML=''; onConfirm(document.getElementById('finalPriceInput').value); };
                root.innerHTML = `
                    <div class="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
                        <div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-xl max-w-sm w-full animate-[slideUp_0.2s_ease-out] border border-primaryPink/20">
                            <div class="w-12 h-12 bg-primaryPink/20 rounded-full flex items-center justify-center mb-4"><i data-lucide="image-check" class="w-6 h-6 text-primaryPink"></i></div>
                            <h3 class="font-bold text-lg mb-2 text-textDark dark:text-white">${t('submitArt')}</h3>
                            <p class="text-sm text-softRedText bg-softRed/10 p-3 rounded-xl border border-softRed mb-4 font-medium flex gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i> ${t('watermarkWarning')}</p>
                            <label class="block text-sm font-bold mb-2 text-textDark dark:text-white">${t('finalPrice')} (${order.currency === 'Stars' ? '⭐' : order.currency})</label>
                            <input type="number" id="finalPriceInput" class="custom-input font-bold text-lg mb-6" value="${order.price}" min="0">
                            <div class="flex gap-3">
                                <button onclick="document.getElementById('modal-root').innerHTML=''" class="flex-1 bg-bgCream dark:bg-darkBg text-textDark dark:text-white border border-primaryPink/20 font-bold py-3 rounded-xl active:scale-95">Назад</button>
                                <button onclick="window._sa()" class="flex-[2] bg-primaryPink text-darkBg font-bold py-3 rounded-xl active:scale-95">${t('submitFinalBtn')}</button>
                            </div>
                        </div>
                    </div>`;
                if(window.lucide) lucide.createIcons();
            }
        };

        const formatPrice = (p, c) => p ? (c === 'Stars' ? `${p} ⭐` : `${p} ${c}`) : '';
        const getAvatar = (url, name, s='10') => url ? `<img src="${url}" class="w-${s} h-${s} rounded-full border-2 border-primaryPink object-cover shrink-0">` : `<div class="w-${s} h-${s} bg-bgCream dark:bg-darkBg rounded-full border-2 border-primaryPink flex items-center justify-center shrink-0"><i data-lucide="user" class="w-${s/2} h-${s/2} text-primaryPink"></i></div>`;

        function renderHeader() {
            const header = document.getElementById('app-header');
            if (state.view !== 'main') {
                const order = state.mockOrders.find(o => o.id === state.activeOrderId);
                let extraInfo = ''; let cancelBtn = '';
                if (order) {
                    if (state.view === 'chat' && order.price && ['accepted', 'in_review'].includes(order.status)) extraInfo = `<div class="bg-primaryPink/20 text-primaryPink font-bold px-3 py-1 rounded-full text-sm">${formatPrice(order.price, order.currency)}</div>`;
                    if (['pending', 'accepted'].includes(order.status)) cancelBtn = `<button onclick="App.cancelCurrentOrder()" class="p-2 text-softRedText hover:bg-softRed/10 rounded-full"><i data-lucide="x-circle" class="w-6 h-6"></i></button>`;
                }
                header.innerHTML = `<div class="flex items-center text-textDark dark:text-white"><button onclick="App.goBack()" class="p-2 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5"><i data-lucide="chevron-left" class="w-6 h-6"></i></button><h1 class="font-bold text-lg truncate mx-2">${order ? t('types', order.type) : t('back')}</h1>${extraInfo}</div><div>${cancelBtn}</div>`;
            } else {
                let rightAction = currentRole === 'artist' ? `<button onclick="App.toggleTheme()" class="p-2 rounded-full border border-primaryPink/20 hover:bg-black/5 dark:hover:bg-white/5 text-textDark dark:text-white"><div class="w-5 h-5 flex items-center justify-center"><i data-lucide="${state.isDark?'sun':'moon'}" class="w-5 h-5"></i></div></button>` : '';
                header.innerHTML = `<div class="flex items-center gap-3"><div class="w-10 h-10 bg-primaryPink rounded-2xl flex items-center justify-center"><i data-lucide="palette" class="w-6 h-6 text-darkBg"></i></div><h1 class="font-bold text-xl text-textDark dark:text-white">${t('appTitle')}</h1></div><div class="flex items-center gap-2">${rightAction}</div>`;
            }
        }

        function renderBottomNav() {
            const nav = document.getElementById('app-bottom-nav');
            if (state.view !== 'main') { nav.innerHTML = ''; return; }
            let tabsHTML = '';
            if (currentRole === 'artist') {
                const unread = state.mockOrders.filter(o => o.status === 'pending' && !o.isRead).length;
                tabsHTML = `
                    <button onclick="App.switchTab('new_requests')" class="flex-1 py-4 flex flex-col items-center gap-1 ${state.tab === 'new_requests' ? 'text-primaryPink opacity-100' : 'opacity-40 text-textDark dark:text-white'} transition-all">
                        <div class="w-6 h-6 relative flex items-center justify-center">
                            <i data-lucide="inbox" class="w-6 h-6"></i>
                            ${unread > 0 ? `<span class="absolute -top-1 -right-2 w-3 h-3 bg-softRed rounded-full glowing-dot border-2 border-white dark:border-darkBg"></span>` : ''}
                        </div>
                        <span class="text-[10px] font-bold">${t('tabNew')}</span>
                    </button>
                    <button onclick="App.switchTab('active_works')" class="flex-1 py-4 flex flex-col items-center gap-1 ${state.tab === 'active_works' ? 'text-primaryPink opacity-100' : 'opacity-40 text-textDark dark:text-white'} transition-all">
                        <div class="w-6 h-6 relative flex items-center justify-center"><i data-lucide="paintbrush" class="w-6 h-6"></i></div>
                        <span class="text-[10px] font-bold">${t('tabActive')}</span>
                    </button>
                    <button onclick="App.switchTab('banned')" class="flex-1 py-4 flex flex-col items-center gap-1 ${state.tab === 'banned' ? 'text-softRedText opacity-100' : 'opacity-40 text-textDark dark:text-white'} transition-all">
                        <div class="w-6 h-6 relative flex items-center justify-center"><i data-lucide="shield-alert" class="w-6 h-6"></i></div>
                        <span class="text-[10px] font-bold">${t('tabBanned')}</span>
                    </button>`;
            } else {
                tabsHTML = `
                    <button onclick="App.switchTab('order_art')" class="flex-1 py-4 flex flex-col items-center gap-1 ${state.tab === 'order_art' ? 'text-primaryPink opacity-100' : 'opacity-40 text-textDark dark:text-white'} transition-all">
                        <div class="w-6 h-6 relative flex items-center justify-center"><i data-lucide="pen-tool" class="w-6 h-6"></i></div>
                        <span class="text-[10px] font-bold">${t('tabOrder')}</span>
                    </button>
                    <button onclick="App.switchTab('profile')" class="flex-1 py-4 flex flex-col items-center gap-1 ${state.tab === 'profile' ? 'text-primaryPink opacity-100' : 'opacity-40 text-textDark dark:text-white'} transition-all">
                        <div class="w-6 h-6 relative flex items-center justify-center"><i data-lucide="user" class="w-6 h-6"></i></div>
                        <span class="text-[10px] font-bold">${t('tabProfile')}</span>
                    </button>`;
            }
            nav.innerHTML = `<div class="flex justify-between px-4">${tabsHTML}</div>`;
        }

        function renderEmptyState(title, desc, iconName) {
            return `<div class="flex flex-col items-center justify-center p-10 text-center animate-[fadeIn_0.5s_ease-out]"><div class="w-24 h-24 bg-primaryPink/10 rounded-full flex items-center justify-center mb-6"><i data-lucide="${iconName}" class="w-12 h-12 text-primaryPink"></i></div><h3 class="font-bold text-xl mb-2 text-textDark dark:text-white">${title}</h3><p class="text-sm opacity-60 max-w-[200px] leading-relaxed text-textDark dark:text-gray-300">${desc}</p></div>`;
        }

        function renderCustomerForm() {
            return `
                <div class="p-4 space-y-6 animate-[fadeIn_0.3s_ease-out]">
                    <div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-sm border border-primaryPink/10 dark:border-primaryPink/20">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-textDark dark:text-white"><i data-lucide="sparkles" class="w-5 h-5 text-primaryPink"></i> ${t('formTitle')}</h2>
                        <form id="orderForm" onsubmit="App.submitOrder(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-semibold mb-2 ml-1 opacity-80 text-textDark dark:text-gray-200">${t('artType')}</label>
                                <div class="relative"><select id="formType" required class="custom-input appearance-none"><option value="portrait">${t('types', 'portrait')}</option><option value="halfBody">${t('types', 'halfBody')}</option><option value="fullBody">${t('types', 'fullBody')}</option><option value="chibi">${t('types', 'chibi')}</option><option value="sketch">${t('types', 'sketch')}</option><option value="other">${t('types', 'other')}</option></select><i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 opacity-50 pointer-events-none text-textDark dark:text-white"></i></div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold mb-2 ml-1 opacity-80 text-textDark dark:text-gray-200">${t('description')}</label>
                                <textarea id="formDesc" required rows="4" class="custom-input resize-none" placeholder="..."></textarea>
                            </div>
                            <div>
                                <label class="flex items-center justify-center gap-2 w-full p-4 border-2 border-dashed border-primaryPink/40 rounded-xl bg-primaryPink/5 dark:bg-primaryPink/10 cursor-pointer hover:bg-primaryPink/10 text-textDark dark:text-white transition-colors">
                                    <i data-lucide="image-plus" class="w-5 h-5 text-primaryPink"></i><span class="font-medium text-sm" id="uploadLabel">${state.draftImages.length > 0 ? `${state.draftImages.length}${t('filesAttached')}` : t('uploadBtn')}</span>
                                    <input type="file" accept="image/png, image/jpeg, image/jpg" class="hidden" multiple onchange="App.handleFormUpload(event)">

        function renderCustomerProfile() {

        function renderArtistList() {
            const filters = state.tab === 'new_requests' ? ['pending'] : (state.tab === 'banned' ? ['banned'] : ['accepted', 'in_review', 'completed', 'cancelled']);
            const orders = state.mockOrders.filter(o => filters.includes(o.status)).slice().reverse();

            if (!orders.length) return renderEmptyState(state.tab === 'new_requests' ? t('emptyNewTitle') : (state.tab === 'banned' ? t('emptyBannedTitle') : t('emptyActiveTitle')), state.tab === 'new_requests' ? t('emptyNewDesc') : (state.tab === 'banned' ? t('emptyBannedDesc') : t('emptyActiveDesc')), state.tab === 'new_requests' ? 'coffee' : (state.tab === 'banned' ? 'shield-check' : 'check-circle-2'));

            return `<div class="p-4 space-y-3 animate-[fadeIn_0.3s_ease-out]">${orders.map(o => `
                <div ${state.tab !== 'banned' ? `onclick="App.openOrder('${o.id}')"` : ''} class="bg-white dark:bg-darkSurface p-5 rounded-2xl shadow-sm border ${!o.isRead && state.tab==='new_requests' ? 'border-primaryPink shadow-[0_0_10px_rgba(244,199,204,0.3)] dark:shadow-none' : 'border-primaryPink/10 dark:border-primaryPink/20'} relative overflow-hidden${['completed', 'cancelled'].includes(o.status) ? 'opacity-60' : ''}">
                    ${!o.isRead && state.tab === 'new_requests' ? `<div class="absolute top-5 right-5 w-3 h-3 bg-primaryPink rounded-full glowing-dot"></div>` : ''}

                        <div><h3 class="font-bold text-lg">${t('types', o.type)}</h3><div class="flex items-center gap-2 mt-1">${getAvatar(o.customerPhoto, o.customerName, '4')}<p class="text-xs opacity-60">${o.customerName}</p></div></div>
                        <div class="flex flex-col items-end gap-1">${o.price ? `<span class="font-bold bg-primaryPink/20 text-primaryPink px-2 py-0.5 rounded text-sm">${formatPrice(o.price, o.currency)}</span>` : ''}${state.tab === 'active_works' ? `<span class="text-[10px] font-bold uppercase opacity-60">${t(o.status)}</span>` : ''}</div>
                    </div>
                    <p class="text-sm opacity-80 line-clamp-2 leading-relaxed bg-bgCream dark:bg-darkBg p-3 rounded-xl border border-primaryPink/5 text-textDark dark:text-gray-200">${o.description}</p>
                    <div class="mt-4 flex items-center justify-between text-xs font-medium text-textDark dark:text-gray-300">
                        <span>${formatDate(o.date)}</span>${state.tab === 'banned' ? `<button onclick="App.unbanUser('${o.id}')" class="px-4 py-2 bg-textDark dark:bg-white text-white dark:text-darkBg rounded-lg font-bold">${t('unban')}</button>` : `<span class="flex items-center gap-1 opacity-50">${state.tab === 'new_requests' ? 'Review' : 'Open'} <i data-lucide="arrow-right" class="w-3 h-3"></i></span>`}
                    </div>
                </div>`).join('')}</div>`;
        }

        function renderOrderDetail() {
            const order = state.mockOrders.find(o => o.id === state.activeOrderId);
            if (!order) return '';
            const isPending = order.status === 'pending';
            let actions = '';

            if (currentRole === 'artist' && isPending) {
                actions = `
                    <div class="mt-8 space-y-4">
                        <div class="bg-white dark:bg-darkSurface p-5 rounded-2xl border border-primaryPink"><label class="block text-sm font-bold mb-3 text-textDark dark:text-white">${t('setPrice')}</label>
                            <div class="flex gap-2"><input type="number" id="priceInput" class="custom-input font-bold text-lg flex-1" placeholder="0" min="1"><select id="currencyInput" class="custom-input font-bold w-28 text-center appearance-none"><option value="BYN">BYN</option><option value="Stars">⭐</option></select></div>
                            <button onclick="App.acceptCurrentOrder()" class="w-full mt-4 bg-primaryPink text-darkBg font-bold py-4 rounded-xl active:scale-95">${t('acceptOrder')}</button>
                        </div>
                        <div class="grid grid-cols-2 gap-3"><button onclick="api.declineOrder('${order.id}'); App.goBack();" class="bg-white dark:bg-darkSurface text-textDark dark:text-white border-2 border-primaryPink/20 font-bold py-3 rounded-xl active:scale-95">${t('declineOrder')}</button><button onclick="UI.showConfirm('${t('banUser')}?', ()=>{api.banUser('${order.id}'); App.goBack();})" class="bg-white dark:bg-darkSurface border-2 border-softRed text-softRedText font-bold py-3 rounded-xl active:scale-95">${t('banUser')}</button></div>
                    </div>`;
            } else if (currentRole === 'customer' && isPending) {
                actions = `<div class="mt-8 text-center p-6 bg-bgCream dark:bg-darkBg rounded-2xl border border-primaryPink/20 text-textDark dark:text-white"><div class="inline-flex items-center justify-center w-12 h-12 bg-primaryPink/30 rounded-full mb-3"><i data-lucide="clock" class="w-6 h-6 text-primaryPink"></i></div><h3 class="font-bold text-lg mb-1">Ожидаем художника</h3></div>`;
            }

            const refsHtml = (order.references && order.references.length) ? `<div class="mt-4"><h3 class="text-xs font-bold uppercase opacity-50 mb-2 text-textDark dark:text-gray-200">Фото</h3><div class="flex gap-2 overflow-x-auto pb-2">${order.references.map(img => `<img src="${img}" class="w-20 h-20 object-cover rounded-lg border border-primaryPink/30">`).join('')}</div></div>` : '';

            return `
                <div class="p-4 animate-[slideInRight_0.3s_ease-out]">
                    <div class="bg-white dark:bg-darkSurface p-6 rounded-3xl shadow-sm border border-primaryPink/10 dark:border-primaryPink/20 relative">
                        <div class="absolute top-6 right-6 bg-bgCream dark:bg-darkBg px-3 py-1 rounded-lg border border-primaryPink/20 text-xs font-bold uppercase opacity-80 text-textDark dark:text-white">${t(order.status)}</div>
                        <div class="mb-6 pr-20 text-textDark dark:text-white"><h2 class="text-2xl font-bold mb-2">${t('types', order.type)}</h2><div class="flex items-center gap-2 mb-1">${getAvatar(order.customerPhoto, order.customerName, '6')}<p class="text-sm font-medium opacity-80">${order.customerName}</p></div></div>
                        <div class="bg-bgCream dark:bg-darkBg p-4 rounded-xl border border-primaryPink/10"><p class="text-sm leading-relaxed whitespace-pre-wrap text-textDark dark:text-gray-200">${order.description}</p></div>
                        ${refsHtml} ${actions}
                    </div>
                </div>`;
        }

        function renderChatMessagesOnly() {
            const order = state.mockOrders.find(o => o.id === state.activeOrderId);
            if (!order) return '';
            const msgs = order.messages.map(m => {
                if (m.sender === 'system') return `<div class="flex justify-center my-4"><span class="bg-primaryPink/20 border border-primaryPink/30 text-textDark dark:text-white text-xs font-bold px-4 py-1.5 rounded-full text-center">${m.text}</span></div>`;
                const isMe = m.sender === currentRole;
                const photo = m.photo ? `<img src="${m.photo}" class="w-full rounded-lg mb-2 border border-black/10">` : '';
                return `
                    <div class="flex w-full mb-4 ${isMe ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-[80%] rounded-2xl px-4 py-2.5 shadow-sm ${isMe ? 'bg-primaryPink text-darkBg rounded-tr-sm' : 'bg-white dark:bg-darkSurface text-textDark dark:text-gray-100 dark:border-primaryPink/25 border border-primaryPink/10 rounded-tl-sm'}">
                            ${photo}<p class="text-sm leading-relaxed whitespace-pre-wrap break-words">${m.text}</p>${m.date ? `<p class="text-[10px] opacity-50 mt-1 text-right">${formatDate(m.date).split(',')[1]}</p>` : ''}
                        </div>
                    </div>`;
            }).join('');
            return msgs.length ? msgs : renderEmptyState('Чат', 'Здесь можно обсудить детали.', 'message-circle');
        }

        function renderChat() {
            const order = state.mockOrders.find(o => o.id === state.activeOrderId);
            if (!order) return '';

            let controls = '';
            if (order.status === 'accepted') {
                if (currentRole === 'artist') {
                    controls = `
                        <div class="bg-white dark:bg-darkSurface border-t border-primaryPink/30 p-3 shrink-0">
                            <button onclick="UI.showSubmitArtModal(state.mockOrders.find(o=>o.id==='${order.id}'), (p) => { api.submitFinalArt('${order.id}', p); App.render(); })" class="w-full bg-bgCream dark:bg-darkBg border border-primaryPink/30 text-textDark dark:text-white font-bold py-2 rounded-xl text-sm mb-3 flex justify-center items-center gap-2 hover:bg-primaryPink/10"><i data-lucide="upload-cloud" class="w-4 h-4"></i> ${t('submitArt')}</button>
                            <div class="flex gap-2 items-end">
                                <label class="cursor-pointer p-3 bg-bgCream dark:bg-darkBg text-textDark dark:text-white rounded-xl border border-primaryPink/30 shrink-0 hover:bg-primaryPink/10"><i data-lucide="image" class="w-5 h-5"></i><input type="file" id="chatPhoto" class="hidden" accept="image/png, image/jpeg, image/jpg"></label>
                                <textarea id="chatInput" rows="1" class="flex-1 custom-input resize-none py-3" placeholder="${t('chatPlaceholder')}" oninput="this.style.height=''; this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
                                <button onclick="App.sendChat()" class="bg-primaryPink text-darkBg w-12 h-12 rounded-xl flex items-center justify-center shrink-0 active:scale-95"><i data-lucide="send" class="w-5 h-5 ml-1"></i></button>
                            </div>
                        </div>`;
                } else {
                    controls = `
                        <div class="bg-white dark:bg-darkSurface border-t border-primaryPink/30 p-3 shrink-0 flex gap-2 items-end pb-safe-offset-4">
                            <label class="cursor-pointer p-3 bg-bgCream dark:bg-darkBg text-textDark dark:text-white rounded-xl border border-primaryPink/30 shrink-0 hover:bg-primaryPink/10"><i data-lucide="image" class="w-5 h-5"></i><input type="file" id="chatPhoto" class="hidden" accept="image/png, image/jpeg, image/jpg"></label>
                            <textarea id="chatInput" rows="1" class="flex-1 custom-input resize-none py-3" placeholder="${t('chatPlaceholder')}" oninput="this.style.height=''; this.style.height=Math.min(this.scrollHeight,120)+'px';"></textarea>
                            <button onclick="App.sendChat()" class="bg-primaryPink text-darkBg w-12 h-12 rounded-xl flex items-center justify-center shrink-0 active:scale-95"><i data-lucide="send" class="w-5 h-5 ml-1"></i></button>
                        </div>`;
                }
            } else if (order.status === 'in_review') {
                if (currentRole === 'customer') controls = `<div class="p-3 bg-white dark:bg-darkSurface border-t border-primaryPink/30 flex gap-2 pb-safe-offset-4"><button onclick="api.requestRevision('${order.id}'); App.render();" class="flex-1 border-2 border-primaryPink/40 text-textDark dark:text-white font-bold py-3 rounded-xl active:scale-95">${t('requestRevision')}</button><button onclick="UI.showConfirm('Одобрить заказ?', ()=>{api.completeOrder('${order.id}'); App.render();})" class="flex-[1.5] bg-primaryPink text-darkBg font-bold py-3 rounded-xl active:scale-95 shadow-md">${t('approvePay')}</button></div>`;
                else controls = `<div class="p-4 text-center text-sm font-bold opacity-60 pb-safe-offset-4 text-textDark dark:text-white">${t('waitReview')}</div>`;
            } else if (['completed', 'cancelled'].includes(order.status)) {
                controls = `<div class="p-4 text-center text-sm font-bold opacity-60 pb-safe-offset-4 text-textDark dark:text-white">${t(order.status)}</div>`;
            }

            return `<div class="flex flex-col h-full overflow-hidden w-full"><div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col">${renderChatMessagesOnly()}</div>${controls}</div>`;
        }

        const App = {
            init: () => { 
                if (state.isDark) document.documentElement.classList.add('dark');
                App.render(); 
                api.sync(); 
                setInterval(api.sync, 2000); 
            },
            render: () => {
                renderHeader(); renderBottomNav();
                const content = document.getElementById('app-content');
                if (state.view === 'main') {
                    if (currentRole === 'artist') content.innerHTML = renderArtistList();
                    else content.innerHTML = state.tab === 'order_art' ? renderCustomerForm() : renderCustomerProfile();
                } else if (state.view === 'order_detail') content.innerHTML = renderOrderDetail();
                else if (state.view === 'chat') {
                    content.innerHTML = renderChat();
                    setTimeout(() => { const c = document.getElementById('chat-messages'); if(c) c.scrollTop = c.scrollHeight; }, 50);
                }
                
                setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 10);
            },
            switchTab: (id) => { state.tab = id; state.view = 'main'; state.activeOrderId = null; App.render(); },
            setLang: (l) => { state.lang = l; App.render(); },
            toggleTheme: () => { 
                state.isDark = !state.isDark; 
                document.documentElement.classList.toggle('dark', state.isDark); 
                App.render(); 
            },
            openOrder: (id) => {
                state.activeOrderId = id; const o = state.mockOrders.find(x => x.id === id);
                if (currentRole === 'artist' && o.status === 'pending' && !o.isRead) api.markAsRead(id);
                state.view = ['accepted', 'in_review', 'completed', 'cancelled'].includes(o.status) ? 'chat' : 'order_detail';
                App.render();
            },
            goBack: () => { state.view = 'main'; state.activeOrderId = null; App.render(); },
            
            handleFormUpload: async (e) => {
                const files = Array.from(e.target.files).slice(0, 3);
                state.draftImages = await Promise.all(files.map(f => compressImage(f)));
                document.getElementById('uploadLabel').innerText = `${state.draftImages.length} ${t('filesAttached')}`;
            },
            submitOrder: async (e) => {
                e.preventDefault();
                try {
                    await api.createOrder(document.getElementById('formType').value, document.getElementById('formDesc').value, state.draftImages);
                    state.draftImages = []; document.getElementById('orderForm').reset(); 
                    if(tg && tg.showAlert) tg.showAlert(t('orderSent')); else UI.showAlert(t('orderSent'));
                    App.switchTab('profile'); 
                } catch(err) {
                    // Ошибка уже выведена в api.postAction
                }
            },
            acceptCurrentOrder: () => {
                const p = parseFloat(document.getElementById('priceInput').value);
                if(isNaN(p) || p<=0) return alert('Укажите цену.');
                api.acceptOrder(state.activeOrderId, p, document.getElementById('currencyInput').value);
                state.view = 'chat'; App.render();
            },
            cancelCurrentOrder: () => { UI.showConfirm(t('cancelConfirm'), () => { api.cancelOrder(state.activeOrderId); App.render(); }); },
            unbanUser: (id) => { UI.showConfirm('Разблокировать?', () => { api.unbanUser(id); App.render(); }); },

            sendChat: async () => {
                const input = document.getElementById('chatInput');
                const photoInput = document.getElementById('chatPhoto');
                const text = input.value.trim();
                let photoStr = null;

                if (photoInput && photoInput.files.length) {
                    photoStr = await compressImage(photoInput.files[0]);
                }
                if (text || photoStr) {
                    api.sendMessage(state.activeOrderId, text, photoStr);
                    input.value = ''; input.style.height = ''; if(photoInput) photoInput.value = '';
                    const o = state.mockOrders.find(x => x.id === state.activeOrderId);
                    o.messages.push({ sender: currentRole, text: text, photo: photoStr, date: new Date().toISOString() });
                    const chatDiv = document.getElementById('chat-messages');
                    if (chatDiv) { chatDiv.innerHTML = renderChatMessagesOnly(); chatDiv.scrollTop = chatDiv.scrollHeight; setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 10); }
                }
            }
        };

        window.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>
