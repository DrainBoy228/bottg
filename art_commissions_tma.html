<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Art Commissions</title>
    
    <!-- Google Fonts: Quicksand for a soft, rounded aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons via CDN (Vector Icons only, strictly no emojis) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* Elegant, cozy, pastel palette */
            --bg-color: #FDFBF7; /* Warm cream */
            --bg-gradient: linear-gradient(135deg, #FDFBF7 0%, #FAEDEF 100%);
            --primary-color: #F4C7CC; /* Soft pastel pink */
            --primary-hover: #EBB5BB; /* Blush rose */
            --primary-active: #E0A4AB;
            
            --text-color: #4A4345; /* Soft charcoal */
            --text-light: #8C8486;
            --text-on-primary: #4A4345; /* Dark text on pink for warmth */
            
            --surface-color: rgba(255, 255, 255, 0.65); /* Frosted glass */
            --surface-border: rgba(255, 255, 255, 0.9);
            
            --shadow-soft: 0 8px 32px rgba(230, 190, 195, 0.25);
            --shadow-inner: inset 0 2px 4px rgba(230, 190, 195, 0.1);
            
            --radius-lg: 32px;
            --radius-md: 20px;
            --radius-sm: 12px;
            --radius-pill: 100px;
            
            /* Fluid, organic animations */
            --transition-spring: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            --transition-fade: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        h1, h2, h3, h4 {
            font-weight: 700;
            color: var(--text-color);
        }

        p {
            line-height: 1.6;
        }

        /* App Container mimicking TMA constraints */
        #app {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .glass-card {
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 24px;
            transition: var(--transition-spring);
        }

        .btn {
            background: var(--primary-color);
            color: var(--text-on-primary);
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            border: none;
            border-radius: var(--radius-pill);
            padding: 14px 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition-spring);
            box-shadow: 0 4px 12px rgba(244, 199, 204, 0.4);
            width: 100%;
        }

        .btn:hover, .btn:active {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(244, 199, 204, 0.6);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }
        
        .btn-outline:hover, .btn-outline:active {
            background: rgba(244, 199, 204, 0.1);
            transform: translateY(0);
            box-shadow: none;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            font-size: 14px;
            margin-left: 4px;
        }

        .input, .select, .textarea {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            padding: 16px;
            font-family: inherit;
            font-size: 16px;
            color: var(--text-color);
            transition: var(--transition-fade);
            box-shadow: var(--shadow-inner);
            width: 100%;
            outline: none;
            -webkit-appearance: none;
        }

        .textarea {
            resize: vertical;
            min-height: 120px;
        }

        .input:focus, .select:focus, .textarea:focus {
            background: #FFFFFF;
            border-color: var(--primary-color);
        }

        /* Custom select arrow wrapper */
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-right: 2px solid var(--text-light);
            border-bottom: 2px solid var(--text-light);
            rotate: 45deg;
            pointer-events: none;
            transition: var(--transition-fade);
        }

        .header {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .prototype-banner {
            background: rgba(74, 67, 69, 0.05);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 24px 0;
            font-size: 14px;
        }

        .prototype-switch {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-pill);
            padding: 6px 12px;
            font-family: inherit;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: var(--transition-fade);
        }
        .prototype-switch:hover { background: #fff; }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 100px 24px; /* Bottom padding for nav */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Animation class for views */
        .fade-in {
            animation: softFadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        @keyframes softFadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 552px; /* 600 - 48 */
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-pill);
            display: flex;
            justify-content: space-around;
            padding: 8px;
            box-shadow: var(--shadow-soft);
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
            color: var(--text-light);
            text-decoration: none;
            cursor: pointer;
            border-radius: var(--radius-pill);
            transition: var(--transition-spring);
        }

        .nav-item span {
            font-size: 12px;
            font-weight: 600;
        }

        .nav-item.active {
            color: var(--text-on-primary);
            background: var(--primary-color);
            box-shadow: 0 4px 12px rgba(244, 199, 204, 0.3);
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .order-card:hover {
            transform: scale(1.02);
        }

        .order-info h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }
        .order-info p {
            font-size: 14px;
            color: var(--text-light);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
        }
        .status-pending { background: #FFF3CD; color: #856404; }
        .status-accepted { background: #D4EDDA; color: #155724; }
        .status-declined { background: #F8D7DA; color: #721C24; }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            text-align: center;
            padding: 16px;
        }
        .stat-box h2 {
            font-size: 28px;
            color: var(--primary-active);
            margin-bottom: 4px;
        }

        /* Chat Styles */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px); /* Adjust based on header/nav */
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            line-height: 1.4;
            animation: softFadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .message-sent {
            align-self: flex-end;
            background: var(--primary-color);
            color: var(--text-on-primary);
            border-bottom-right-radius: 4px;
        }
        .message-received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.8);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.9);
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .chat-input-area .input {
            border-radius: var(--radius-pill);
            padding: 12px 20px;
        }
        .btn-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            padding: 0;
            flex-shrink: 0;
        }

        /* Settings item */
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .settings-item:last-child {
            border-bottom: none;
        }
        .lang-switch {
            display: flex;
            background: rgba(255,255,255,0.5);
            border-radius: var(--radius-pill);
            padding: 4px;
        }
        .lang-btn {
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            border: none;
            background: transparent;
            font-family: inherit;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            transition: var(--transition-fade);
        }
        .lang-btn.active {
            background: #fff;
            color: var(--text-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Prototype banner (temporary tool) -->
        <div class="prototype-banner">
            <span id="txt-prototype">Prototype Tool:</span>
            <button class="prototype-switch" id="role-switch-btn" onclick="toggleRole()">View as Artist</button>
        </div>

        <header class="header">
            <h2 id="header-title">Order Custom Art</h2>
        </header>

        <main class="content-area" id="content">
            <!-- Dynamic content injected here via JS -->
        </main>

        <nav class="bottom-nav" id="main-nav">
            <!-- Dynamic nav items injected here -->
        </nav>
    </div>

    <script>
        
        // Application State
        const state = {
            role: 'customer', // 'customer' or 'artist'
            lang: 'en', // 'en' or 'ru'
            currentView: 'order', // order, profile, chat (customer) | inbox, detail, chats, chat (artist)
            selectedOrderId: null
        };

        // Mock Orders Data (Simulating a database)
        const mockOrders = [
            {
                id: 'ORD-001',
                customerName: 'Alice L.',
                type: 'Portrait', // Store raw English, translate on render
                description: 'A soft pastel portrait of my cat. Reference attached.',
                status: 'pending', // pending, accepted, declined
                date: '2026-09-21',
                messages: []
            },
            {
                id: 'ORD-002',
                customerName: 'Bob M.',
                type: 'Full Body',
                description: 'Full body character design for a cozy fantasy game.',
                status: 'accepted',
                date: '2026-09-20',
                messages: [
                    { sender: 'artist', text: 'Hello! I have started the initial sketch.', time: '10:00 AM' },
                    { sender: 'customer', text: 'Wonderful, cannot wait to see it!', time: '10:15 AM' }
                ]
            }
        ];

        const i18n = {
            en: {
                prototype_tool: "Prototype Tool:",
                view_artist: "View as Artist",
                view_customer: "View as Customer",
                
                // Navigation
                nav_order: "Order Art",
                nav_profile: "Profile",
                nav_inbox: "Inbox",
                nav_chats: "Chats",
                
                // Titles
                title_order: "Order Custom Art",
                title_profile: "My Profile",
                title_chat: "Chat with Artist",
                title_inbox: "Order Inbox",
                title_detail: "Request Details",
                title_chats: "Active Chats",
                title_client_chat: "Chat with Client",
                
                // Order Form
                lbl_art_type: "Type of Art",
                lbl_desc: "Description & References",
                placeholder_desc: "Describe what you would like me to draw...",
                btn_upload: "Upload References",
                btn_submit: "Submit Request",
                msg_submitted: "Request submitted successfully!",
                
                // Art Types
                type_portrait: "Portrait",
                type_half: "Half Body",
                type_full: "Full Body",
                type_chibi: "Chibi",
                type_sketch: "Sketch",
                type_other: "Other",
                
                // Profile
                stat_total: "Total Orders",
                stat_active: "Active",
                history_title: "Order History",
                settings_title: "Settings",
                lbl_language: "Language",
                
                // Artist Detail View
                lbl_client: "Client",
                lbl_date: "Date",
                btn_accept: "Accept Order",
                btn_decline: "Decline Gently",
                
                // Status
                status_pending: "Pending",
                status_accepted: "Accepted",
                status_declined: "Declined",
                
                // Chat
                placeholder_chat: "Type a message..."
            },
            ru: {
                prototype_tool: "Инструмент:",
                view_artist: "Взгляд Художника",
                view_customer: "Взгляд Клиента",
                
                nav_order: "Заказ Арта",
                nav_profile: "Профиль",
                nav_inbox: "Входящие",
                nav_chats: "Чаты",
                
                title_order: "Заказать Арт",
                title_profile: "Мой Профиль",
                title_chat: "Чат с Художником",
                title_inbox: "Новые Заказы",
                title_detail: "Детали Заказа",
                title_chats: "Активные Чаты",
                title_client_chat: "Чат с Клиентом",
                
                lbl_art_type: "Тип рисунка",
                lbl_desc: "Описание и референсы",
                placeholder_desc: "Опишите, что бы вы хотели, чтобы я нарисовал(а)...",
                btn_upload: "Загрузить референсы",
                btn_submit: "Отправить заказ",
                msg_submitted: "Заказ успешно отправлен!",
                
                type_portrait: "Портрет",
                type_half: "По пояс",
                type_full: "В полный рост",
                type_chibi: "Чиби",
                type_sketch: "Скетч",
                type_other: "Другое",
                
                stat_total: "Всего заказов",
                stat_active: "Активные",
                history_title: "История заказов",
                settings_title: "Настройки",
                lbl_language: "Язык",
                
                lbl_client: "Клиент",
                lbl_date: "Дата",
                btn_accept: "Принять Заказ",
                btn_decline: "Мягко Отклонить",
                
                status_pending: "В ожидании",
                status_accepted: "Принят",
                status_declined: "Отклонен",
                
                placeholder_chat: "Написать сообщение..."
            }
        };

        // Helper: Get translation
        function t(key) {
            return i18n[state.lang][key] || key;
        }

        // Helper: Map Art Type to translation
        function translateArtType(typeEn) {
            const map = {
                'Portrait': 'type_portrait',
                'Half Body': 'type_half',
                'Full Body': 'type_full',
                'Chibi': 'type_chibi',
                'Sketch': 'type_sketch',
                'Other': 'type_other'
            };
            return t(map[typeEn]) || typeEn;
        }

        const contentEl = document.getElementById('content');
        const navEl = document.getElementById('main-nav');
        const headerTitle = document.getElementById('header-title');

        function toggleRole() {
            state.role = state.role === 'customer' ? 'artist' : 'customer';
            const btn = document.getElementById('role-switch-btn');
            btn.innerText = state.role === 'customer' ? t('view_artist') : t('view_customer');
            
            // Reset view on role change
            state.currentView = state.role === 'customer' ? 'order' : 'inbox';
            renderApp();
        }

        function setLanguage(lang) {
            state.lang = lang;
            document.getElementById('txt-prototype').innerText = t('prototype_tool');
            document.getElementById('role-switch-btn').innerText = state.role === 'customer' ? t('view_artist') : t('view_customer');
            renderApp();
        }

        function navigate(view, orderId = null) {
            state.currentView = view;
            if (orderId) state.selectedOrderId = orderId;
            renderApp();
        }

        function renderApp() {
            contentEl.innerHTML = ''; // Clear content
            renderNavigation();
            
            // Update Header Title based on view
            const titles = {
                'order': t('title_order'),
                'profile': t('title_profile'),
                'chat_customer': t('title_chat'),
                'inbox': t('title_inbox'),
                'detail': t('title_detail'),
                'chats_list': t('title_chats'),
                'chat_artist': t('title_client_chat')
            };
            headerTitle.innerText = titles[state.currentView] || "App";

            // Render specific view
            const viewWrapper = document.createElement('div');
            viewWrapper.className = 'fade-in';

            if (state.role === 'customer') {
                if (state.currentView === 'order') viewWrapper.appendChild(buildOrderView());
                else if (state.currentView === 'profile') viewWrapper.appendChild(buildProfileView());
                else if (state.currentView === 'chat_customer') viewWrapper.appendChild(buildChatView('customer'));
            } else {
                if (state.currentView === 'inbox') viewWrapper.appendChild(buildInboxView());
                else if (state.currentView === 'detail') viewWrapper.appendChild(buildDetailView());
                else if (state.currentView === 'chats_list') viewWrapper.appendChild(buildChatsListView());
                else if (state.currentView === 'chat_artist') viewWrapper.appendChild(buildChatView('artist'));
            }

            contentEl.appendChild(viewWrapper);
            lucide.createIcons(); // Initialize icons for the new DOM elements
        }

        function renderNavigation() {
            navEl.innerHTML = '';
            
            if (state.role === 'customer') {
                // Customer Nav: Order, Profile
                navEl.appendChild(createNavItem('order', 'pencil', t('nav_order')));
                navEl.appendChild(createNavItem('profile', 'user', t('nav_profile')));
                navEl.style.display = 'flex';
            } else {
                // Artist Nav: Inbox, Chats
                navEl.appendChild(createNavItem('inbox', 'inbox', t('nav_inbox')));
                navEl.appendChild(createNavItem('chats_list', 'message-circle', t('nav_chats')));
                navEl.style.display = 'flex';
            }

            // Hide nav inside chat or detail views to give more space
            if (['chat_customer', 'chat_artist', 'detail'].includes(state.currentView)) {
                navEl.style.display = 'none';
                contentEl.style.paddingBottom = '24px';
            } else {
                contentEl.style.paddingBottom = '100px';
            }
        }

        function createNavItem(viewName, iconName, label) {
            const a = document.createElement('a');
            a.className = `nav-item ${state.currentView === viewName ? 'active' : ''}`;
            a.onclick = () => navigate(viewName);
            a.innerHTML = `
                <i data-lucide="${iconName}" width="20" height="20"></i>
                <span>${label}</span>
            `;
            return a;
        }

        function buildOrderView() {
            const div = document.createElement('div');
            div.className = 'glass-card';
            
            div.innerHTML = `
                <form id="order-form" onsubmit="submitOrder(event)">
                    <div class="input-group">
                        <label>${t('lbl_art_type')}</label>
                        <div class="select-wrapper">
                            <select class="select" required>
                                <option value="Portrait">${t('type_portrait')}</option>
                                <option value="Half Body">${t('type_half')}</option>
                                <option value="Full Body">${t('type_full')}</option>
                                <option value="Chibi">${t('type_chibi')}</option>
                                <option value="Sketch">${t('type_sketch')}</option>
                                <option value="Other">${t('type_other')}</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>${t('lbl_desc')}</label>
                        <textarea class="textarea" placeholder="${t('placeholder_desc')}" required></textarea>
                    </div>

                    <div class="input-group">
                        <button type="button" class="btn btn-outline" style="margin-bottom: 16px;">
                            <i data-lucide="image-plus" width="20"></i>
                            ${t('btn_upload')}
                        </button>
                    </div>

                    <button type="submit" class="btn">
                        <i data-lucide="send" width="20"></i>
                        ${t('btn_submit')}
                    </button>
                </form>
            `;
            return div;
        }

        function submitOrder(e) {
            e.preventDefault();
            // Simulate form submission
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" width="20"></i> ${t('msg_submitted')}`;
            btn.style.background = '#81C784'; // Soft green success
            lucide.createIcons();
            
            setTimeout(() => {
                e.target.reset();
                btn.innerHTML = originalText;
                btn.style.background = '';
                lucide.createIcons();
                navigate('profile'); // Send to profile to see the new pending order
            }, 1500);
        }

        function buildProfileView() {
            const div = document.createElement('div');
            
            // Calculate stats
            const total = mockOrders.length;
            const active = mockOrders.filter(o => o.status === 'accepted').length;

            div.innerHTML = `
                <div class="glass-card stat-grid">
                    <div class="stat-box">
                        <h2>${total}</h2>
                        <p>${t('stat_total')}</p>
                    </div>
                    <div class="stat-box">
                        <h2>${active}</h2>
                        <p>${t('stat_active')}</p>
                    </div>
                </div>

                <h3 style="margin: 24px 0 16px;">${t('history_title')}</h3>
                <div class="order-list">
                    ${mockOrders.map(order => `
                        <div class="glass-card order-card" onclick="${order.status === 'accepted' ? `navigate('chat_customer', '${order.id}')` : ''}">
                            <div class="order-info">
                                <h3>${translateArtType(order.type)}</h3>
                                <p>${order.date}</p>
                            </div>
                            <span class="status-badge status-${order.status}">
                                ${t('status_' + order.status)}
                            </span>
                        </div>
                    `).join('')}
                </div>

                <h3 style="margin: 32px 0 16px;">${t('settings_title')}</h3>
                <div class="glass-card">
                    <div class="settings-item">
                        <span style="font-weight: 600;">${t('lbl_language')}</span>
                        <div class="lang-switch">
                            <button class="lang-btn ${state.lang === 'en' ? 'active' : ''}" onclick="setLanguage('en')">EN</button>
                            <button class="lang-btn ${state.lang === 'ru' ? 'active' : ''}" onclick="setLanguage('ru')">RU</button>
                        </div>
                    </div>
                </div>
            `;
            return div;
        }

        function buildInboxView() {
            const div = document.createElement('div');
            const pendingOrders = mockOrders.filter(o => o.status === 'pending');

            if (pendingOrders.length === 0) {
                div.innerHTML = `<p style="text-align: center; color: var(--text-light); margin-top: 40px;">No new requests.</p>`;
                return div;
            }

            div.innerHTML = `
                <div class="order-list">
                    ${pendingOrders.map(order => `
                        <div class="glass-card order-card" onclick="navigate('detail', '${order.id}')">
                            <div class="order-info">
                                <h3>${order.customerName} - ${translateArtType(order.type)}</h3>
                                <p>${order.date}</p>
                            </div>
                            <i data-lucide="chevron-right" width="20" color="var(--text-light)"></i>
                        </div>
                    `).join('')}
                </div>
            `;
            return div;
        }

        function buildDetailView() {
            const div = document.createElement('div');
            const order = mockOrders.find(o => o.id === state.selectedOrderId);

            if (!order) return div;

            div.innerHTML = `
                <button class="btn-outline" style="border: none; padding: 0; margin-bottom: 20px; color: var(--text-light); display: inline-flex; align-items: center; gap: 4px;" onclick="navigate('inbox')">
                    <i data-lucide="arrow-left" width="20"></i> Back
                </button>
                
                <div class="glass-card" style="margin-bottom: 24px;">
                    <div style="margin-bottom: 16px;">
                        <span style="font-size: 12px; color: var(--text-light);">${t('lbl_client')}</span>
                        <h3 style="font-size: 18px;">${order.customerName}</h3>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <span style="font-size: 12px; color: var(--text-light);">${t('lbl_art_type')}</span>
                        <h3 style="font-size: 16px; font-weight: 500;">${translateArtType(order.type)}</h3>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <span style="font-size: 12px; color: var(--text-light);">${t('lbl_date')}</span>
                        <h3 style="font-size: 16px; font-weight: 500;">${order.date}</h3>
                    </div>
                    <div>
                        <span style="font-size: 12px; color: var(--text-light);">${t('lbl_desc')}</span>
                        <p style="background: rgba(255,255,255,0.5); padding: 12px; border-radius: var(--radius-sm); margin-top: 4px;">${order.description}</p>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button class="btn" onclick="updateOrderStatus('${order.id}', 'accepted')">
                        <i data-lucide="check-circle" width="20"></i> ${t('btn_accept')}
                    </button>
                    <button class="btn btn-outline" style="color: #A5737A; border-color: #A5737A;" onclick="updateOrderStatus('${order.id}', 'declined')">
                        ${t('btn_decline')}
                    </button>
                </div>
            `;
            return div;
        }

        function updateOrderStatus(id, newStatus) {
            const order = mockOrders.find(o => o.id === id);
            if(order) order.status = newStatus;
            navigate('inbox');
        }

        function buildChatsListView() {
            const div = document.createElement('div');
            const activeOrders = mockOrders.filter(o => o.status === 'accepted');

            if (activeOrders.length === 0) {
                div.innerHTML = `<p style="text-align: center; color: var(--text-light); margin-top: 40px;">No active chats.</p>`;
                return div;
            }

            div.innerHTML = `
                <div class="order-list">
                    ${activeOrders.map(order => `
                        <div class="glass-card order-card" onclick="navigate('chat_artist', '${order.id}')">
                            <div class="order-info">
                                <h3>${order.customerName}</h3>
                                <p>${translateArtType(order.type)}</p>
                            </div>
                            <i data-lucide="message-circle" width="20" color="var(--primary-color)"></i>
                        </div>
                    `).join('')}
                </div>
            `;
            return div;
        }

        function buildChatView(roleView) {
            const div = document.createElement('div');
            const order = mockOrders.find(o => o.id === state.selectedOrderId);
            const backView = roleView === 'customer' ? 'profile' : 'chats_list';

            if (!order) return div;

            const messagesHtml = order.messages.map(m => {
                const isMine = m.sender === roleView;
                return `
                    <div class="message ${isMine ? 'message-sent' : 'message-received'}">
                        ${m.text}
                        <div style="font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right;">${m.time}</div>
                    </div>
                `;
            }).join('');

            div.className = 'chat-container';
            div.innerHTML = `
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                    <button class="btn-outline" style="border: none; padding: 8px; border-radius: 50%; color: var(--text-color);" onclick="navigate('${backView}')">
                        <i data-lucide="arrow-left" width="24"></i>
                    </button>
                    <div>
                        <h3 style="font-size: 16px;">${roleView === 'customer' ? 'Artist' : order.customerName}</h3>
                        <p style="font-size: 12px; color: var(--text-light);">${translateArtType(order.type)}</p>
                    </div>
                </div>

                <div class="glass-card chat-messages" id="chat-messages-container">
                    ${order.messages.length === 0 ? `<p style="text-align: center; color: var(--text-light); margin-top: auto; margin-bottom: auto;">Start the conversation...</p>` : messagesHtml}
                </div>

                <div class="chat-input-area">
                    <input type="text" class="input" id="chat-input" placeholder="${t('placeholder_chat')}" onkeypress="handleChatEnter(event, '${roleView}')">
                    <button class="btn btn-icon" onclick="sendMessage('${roleView}')">
                        <i data-lucide="send" width="18"></i>
                    </button>
                </div>
            `;

            // Auto-scroll to bottom after render
            setTimeout(() => {
                const container = div.querySelector('#chat-messages-container');
                if (container) container.scrollTop = container.scrollHeight;
            }, 10);

            return div;
        }

        function handleChatEnter(e, role) {
            if (e.key === 'Enter') {
                sendMessage(role);
            }
        }

        function sendMessage(senderRole) {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const order = mockOrders.find(o => o.id === state.selectedOrderId);
            if (order) {
                const now = new Date();
                const time = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
                order.messages.push({ sender: senderRole, text: text, time: time });
                
                // Re-render chat to show new message
                navigate(`chat_${senderRole}`, order.id);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            // Set initial state translations
            document.getElementById('txt-prototype').innerText = t('prototype_tool');
            document.getElementById('role-switch-btn').innerText = state.role === 'customer' ? t('view_artist') : t('view_customer');
            
            // Render UI
            renderApp();
        });
    </script>
</body>
</html>
